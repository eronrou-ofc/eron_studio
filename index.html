<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonChat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Barre latérale -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">💬</div>
                <span>MonChat</span>
            </div>

            <div class="profile">
                <div class="avatar">A</div>
                <div>
                    <strong>Adrien</strong>
                    <small>🟢 En ligne</small>
                </div>
            </div>

            <button class="new-chat">＋ Nouveau chat</button>

            <div class="section-title">DISCUSSIONS</div>

            <div class="chat selected">
                <div class="avatar blue">G</div>
                <div class="chat-info">
                    <strong>Groupe général</strong>
                    <small>Bienvenue sur MonChat !</small>
                </div>
            </div>

            <div class="chat">
                <div class="avatar purple">D</div>
                <div class="chat-info">
                    <strong>Discussion</strong>
                    <small>Aucun message</small>
                </div>
            </div>
        </aside>


        <!-- Zone principale -->
        <main class="chat-area">

            <header class="chat-header">
                <div>
                    <h2>Groupe général</h2>
                    <span>🟢 En ligne</span>
                </div>

                <button class="menu-button">⋮</button>
            </header>


            <section class="messages" id="messages">

                <div class="message other">
                    <div class="avatar blue">M</div>

                    <div>
                        <div class="message-name">MonChat</div>
                        <div class="bubble">
                            👋 Bienvenue sur MonChat !
                        </div>
                        <small class="time">17:30</small>
                    </div>
                </div>

                <div class="message me">
                    <div>
                        <div class="bubble">
                            Salut ! 👋
                        </div>
                        <small class="time">17:31</small>
                    </div>
                </div>

            </section>


            <!-- Barre d'écriture -->
            <form class="input-area" id="messageForm">

                <button type="button" class="attach">＋</button>

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Écris un message..."
                    autocomplete="off"
                >

                <button type="button" class="emoji">😊</button>

                <button type="submit" class="send">
                    ➤
                </button>

            </form>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
