<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonChat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PAGE DE CONNEXION
         ========================= -->

    <div id="authScreen" class="auth-screen">

        <canvas id="particles"></canvas>

        <div class="auth-card">

            <div class="auth-logo">
                💬
            </div>

            <h1>MonChat</h1>

            <p class="auth-subtitle" id="authTitle">
                Connecte-toi à ton espace
            </p>

            <form id="authForm">

                <div class="input-box">
                    <span>👤</span>

                    <input
                        type="text"
                        id="usernameInput"
                        placeholder="Pseudo"
                        autocomplete="username"
                        required
                        minlength="3"
                        maxlength="20"
                    >
                </div>

                <div class="input-box">
                    <span>🔒</span>

                    <input
                        type="password"
                        id="passwordInput"
                        placeholder="Mot de passe"
                        autocomplete="current-password"
                        required
                        minlength="6"
                    >
                </div>

                <button
                    type="submit"
                    id="authButton"
                    class="auth-button"
                >
                    Se connecter
                </button>

            </form>

            <p id="authMessage" class="auth-message"></p>

            <div class="auth-switch">
                <span id="switchText">
                    Pas encore de compte ?
                </span>

                <button
                    type="button"
                    id="switchAuth"
                >
                    Créer un compte
                </button>
            </div>

        </div>
    </div>


    <!-- =========================
         APPLICATION / CHAT
         ========================= -->

    <div
        class="app"
        id="chatApp"
        style="display:none;"
    >

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    💬
                </div>

                <span>
                    MonChat
                </span>

            </div>


            <div class="profile">

                <div
                    class="avatar"
                    id="userAvatar"
                >
                    A
                </div>

                <div>

                    <strong id="usernameDisplay">
                        Utilisateur
                    </strong>

                    <small>
                        🟢 En ligne
                    </small>

                </div>

            </div>


            <button class="new-chat">
                ＋ Nouveau chat
            </button>


            <div class="section-title">
                DISCUSSIONS
            </div>


            <div class="chat selected">

                <div class="avatar blue">
                    G
                </div>

                <div class="chat-info">

                    <strong>
                        Groupe général
                    </strong>

                    <small>
                        Discussion générale
                    </small>

                </div>

            </div>

        </aside>


        <main class="chat-area">

            <header class="chat-header">

                <div>

                    <h2>
                        Groupe général
                    </h2>

                    <span>
                        🟢 En ligne
                    </span>

                </div>

                <button class="menu-button">
                    ⋮
                </button>

            </header>


            <section
                class="messages"
                id="messages"
            >
            </section>


            <form
                class="input-area"
                id="messageForm"
            >

                <button
                    type="button"
                    class="attach"
                >
                    ＋
                </button>

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Écris un message..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="emoji"
                >
                    😊
                </button>

                <button
                    type="submit"
                    class="send"
                >
                    ➤
                </button>

            </form>

        </main>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Notre JavaScript -->
    <script src="script.js"></script>

</body>
</html>
