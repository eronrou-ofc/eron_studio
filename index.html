<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonChat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CONNEXION -->
    <div id="authScreen" class="auth-screen">

        <canvas id="particles"></canvas>

        <div class="auth-card">

            <div class="auth-logo">💬</div>

            <h1>MonChat</h1>

            <p class="auth-subtitle" id="authTitle">
                Connecte-toi à ton espace
            </p>

            <form id="authForm">

                <div class="input-box">
                    <span>👤</span>
                    <input
                        type="text"
                        id="usernameInput"
                        placeholder="Pseudo"
                        autocomplete="username"
                        required
                        minlength="3"
                        maxlength="20"
                    >
                </div>

                <div class="input-box">
                    <span>🔒</span>
                    <input
                        type="password"
                        id="passwordInput"
                        placeholder="Mot de passe"
                        autocomplete="current-password"
                        required
                        minlength="6"
                    >
                </div>

                <button type="submit" id="authButton" class="auth-button">
                    Se connecter
                </button>

            </form>

            <p id="authMessage" class="auth-message"></p>

            <div class="auth-switch">
                <span id="switchText">
                    Pas encore de compte ?
                </span>

                <button type="button" id="switchAuth">
                    Créer un compte
                </button>
            </div>

        </div>
    </div>


    <!-- APPLICATION -->
    <div class="app" id="chatApp" style="display:none;">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">💬</div>
                <span>MONCHAT</span>
            </div>


            <!-- PROFIL -->
            <div class="profile">

                <div class="avatar" id="userAvatar">
                    A
                </div>

                <div class="profile-info">

                    <strong id="usernameDisplay">
                        Utilisateur
                    </strong>

                    <small>
                        🟢 En ligne
                    </small>

                </div>

            </div>


            <!-- RECHERCHE -->
            <div class="search-box">

                <span>⌕</span>

                <input
                    type="text"
                    id="userSearch"
                    placeholder="Rechercher un utilisateur..."
                    autocomplete="off"
                >

            </div>


            <!-- RESULTATS -->
            <div
                class="search-results"
                id="searchResults"
            ></div>


            <!-- DISCUSSIONS -->
            <div class="section-title">
                DISCUSSIONS
            </div>

            <div
                class="conversations"
                id="conversations"
            ></div>


            <!-- DECONNEXION -->
            <button
                class="logout-button"
                id="logoutButton"
            >
                🚪 Déconnexion
            </button>

        </aside>


        <!-- CHAT -->
        <main class="chat-area">

            <header class="chat-header">

                <div>

                    <h2 id="chatTitle">
                        Sélectionne une conversation
                    </h2>

                    <span id="chatStatus">
                        Aucun utilisateur sélectionné
                    </span>

                </div>

                <button class="menu-button">
                    ⋮
                </button>

            </header>


            <!-- MESSAGES -->
            <section
                class="messages"
                id="messages"
            >

                <div class="empty-chat" id="emptyChat">

                    <div class="empty-icon">
                        💬
                    </div>

                    <h3>
                        Tes conversations
                    </h3>

                    <p>
                        Recherche un utilisateur pour commencer à discuter.
                    </p>

                </div>

            </section>


            <!-- ENVOI -->
            <form
                class="input-area"
                id="messageForm"
            >

                <button
                    type="button"
                    class="attach"
                >
                    ＋
                </button>

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Sélectionne d'abord un utilisateur..."
                    autocomplete="off"
                    disabled
                >

                <button
                    type="button"
                    class="emoji"
                >
                    😊
                </button>

                <button
                    type="submit"
                    class="send"
                    disabled
                >
                    ➤
                </button>

            </form>

        </main>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- MONCHAT -->
    <script src="script.js"></script>

</body>
</html>
